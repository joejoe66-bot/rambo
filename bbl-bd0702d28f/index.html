<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Buy Buy Love</title>
<meta name="theme-color" content="#FF8FAB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buy Buy Love">
<style>
  html,body{margin:0;height:100%;background:#FFF5F8;overflow:hidden}
  body{padding-top:env(safe-area-inset-top);box-sizing:border-box}
  iframe{border:0;width:100%;height:100%;display:block}
  #help{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;
    gap:14px;background:#FFF5F8;font-family:-apple-system,"PingFang HK","Noto Sans TC",sans-serif;color:#4A3B47;text-align:center;padding:24px}
  #help img{width:96px;border-radius:24px}
  #help a{background:#FF8FAB;color:#fff;text-decoration:none;font-weight:800;padding:14px 26px;border-radius:999px;font-size:17px}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyYtBZC4qxv4MNZaAZG8o43TMOa1sBBG88lpmgpDtcaG9lZ-3Zj7YyCpXmaC3BVoFTG/exec" allow="camera; clipboard-write"></iframe>
<div id="help">
  <img src="icon-192.png" alt="">
  <b>要先登入 Google 先用到 💕</b>
  <a id="open" href="https://script.google.com/macros/s/AKfycbyYtBZC4qxv4MNZaAZG8o43TMOa1sBBG88lpmgpDtcaG9lZ-3Zj7YyCpXmaC3BVoFTG/exec">打開 Buy Buy Love</a>
</div>
<script>
  // App 載入成功會傳 'bbl-ready'；15 秒都收唔到（例如 iPhone 擋咗登入），就顯示直接打開的按鈕
  var ok = false;
  addEventListener('message', function (e) { if (e.data === 'bbl-ready') { ok = true; document.getElementById('help').style.display = 'none'; } });
  setTimeout(function () { if (!ok) document.getElementById('help').style.display = 'flex'; }, 15000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
